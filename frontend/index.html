<title>Scout 레퍼런스 인텔리전스</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: 일하는 도구. 조용하고 정확하게, 숫자와 소재가 주인공
   IDEA: 엔지니어링 데이터시트처럼 — 코발트 사이드 스트립, 촘촘하고 정렬된 패널
   PICTURE: 수집된 광고 소재 그리드 자체가 그림 (SVG로 그린 소재 썸네일)
   COLOUR and TYPE: 코발트 #1240e0 · 흰색 · 검정 · 옅은 #eef2ff 구역 / Space Grotesk 숫자 + Noto Sans KR

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b0d12,#eef1fb);--mut:light-dark(#5b6275,#9aa3bd);--line:light-dark(#dfe3ee,#232a40);--zone:light-dark(#eef2ff,#11172a);--card:light-dark(#fff,#0f1424);--acc:light-dark(#1240e0,#7b9bff);--strip:#1240e0;--up:light-dark(#1f8a4c,#5fd08e);--down:light-dark(#c2410c,#ff8a5c);--warn:#ef5a2a}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}

.side{background:var(--strip);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}

.nav{display:flex;flex-direction:column;gap:2px}.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#dfe6ff;text-decoration:none;font-weight:500;min-height:42px}.nav a:hover{background:#ffffff1f;color:#fff}.nav a[aria-current=page]{background:#fff;color:#1240e0;font-weight:700}

.iconbtn{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}.iconbtn .dotn{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.page{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(3vw,16px) 80px}

.filters{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--zone);border-radius:12px;margin:12px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.grid.xs{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px #1240e055}
.thumb{position:relative;aspect-ratio:4/5;background:var(--zone)}.thumb svg{display:block;width:100%;height:100%}
.plat{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#000000b3;color:#fff}.plat.inl{position:static;display:inline-block}.p-instagram{background:#d6336c}.p-meta{background:#1240e0}.p-tiktok{background:#111}.p-youtube{background:#e03131}.p-google{background:#2f9e44}.plat.gen{background:#7a4fe0;position:absolute}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.bcard header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bcard header .muted{margin-left:auto;font-size:13px}.bcard .krow{margin:0;grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}.bcard .kpi{padding:8px 10px}.bcard .kpi b{font-size:19px}.bcard .spark{width:100%;height:36px}.bcard footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}

.simh{margin-top:24px}

.memos{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}.memos li{background:var(--zone);border-radius:10px;padding:10px 12px;font-size:14px}.memos small{color:var(--mut);margin-left:8px}.memos p{margin:4px 0 0;white-space:pre-wrap}.memos mark{background:none;color:var(--acc);font-weight:700}.memos .link{font-size:12px;min-height:24px}
.chat{display:flex;flex-direction:column;gap:12px}.chatlog{display:flex;flex-direction:column;gap:14px;max-height:62vh;overflow-y:auto;padding:4px}.msg{max-width:min(760px,92%)}.msg p{margin:0;white-space:pre-wrap;padding:12px 16px;border-radius:14px;line-height:1.65}.msg.user{align-self:flex-end}.msg.user p{background:var(--acc);color:light-dark(#fff,#0a0d18)}.msg.assistant p{background:var(--zone)}.msg .grid{margin-top:10px}
.hello{padding:30px 10px;text-align:center}.hello .chips{justify-content:center;margin-top:16px}
.chatin{display:flex;gap:8px;align-items:flex-end;border:2px solid var(--acc);border-radius:14px;padding:8px}.chatin textarea{border:0!important;min-height:52px}.chatin textarea:focus{outline:0}
.studio{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
.refbox{display:flex;gap:12px;align-items:center;background:var(--zone);padding:10px;border-radius:10px}.refbox .mini{width:64px}.refbox div{flex:1;font-size:13px}.refbox p{margin:2px 0;font-weight:600;color:var(--ink)}
.pick{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);padding:0;cursor:pointer;text-align:left;font-size:12px}.pick span{display:block;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick:hover{border-color:var(--acc)}
.cloud{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:baseline;padding:20px 0;line-height:1.2}.cloud button{border:0;background:none;cursor:pointer;font-weight:800;padding:2px;font-family:"Noto Sans KR"}.cloud button:hover{text-decoration:underline}
.kitprev{max-width:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.kitprev svg{display:block;width:100%}.logo{max-width:120px;border-radius:8px;background:var(--zone);padding:6px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:16px}.plan{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.plan.cur{border:2px solid var(--acc);background:var(--zone)}.plan h2{margin:0}.plan>b{font:600 20px "Space Grotesk","Noto Sans KR"}.plan ul{padding-left:18px;margin:0 0 6px;color:var(--mut);font-size:14px}
.invl,.act{list-style:none;padding:0;margin:0}.invl li,.act li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}.invl li span{flex:1}.act small{margin-left:auto;color:var(--mut)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;z-index:6;top:0}.side .foot{display:none}.logo span{display:none}.nav{flex-direction:row;overflow-x:auto;gap:2px}.nav a{flex:none;padding:8px 12px;min-height:40px;font-size:14px}.nav a .ic{display:none}.top{top:56px}.boards{grid-template-columns:1fr}.bside{position:static;max-height:none}.studio,.detail{grid-template-columns:1fr}.dimg{position:static;max-width:360px}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.sm,.grid.xs{grid-template-columns:repeat(2,minmax(0,1fr))}#credits span{display:none}.ws{font-size:13px}.hl{font-size:13px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start!important}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}.mbox{padding:16px}.tline li{grid-template-columns:1fr;gap:4px}}
.realimg{position:relative;display:block;width:100%;aspect-ratio:4/5;background:var(--zone);overflow:hidden}.realimg img{width:100%;height:100%;object-fit:cover;display:block}.realimg.broken img{display:none}.realimg.broken::after{content:"이미지 없음";position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px}
.vbadge{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#0009}.vbadge::after{content:"";position:absolute;left:12px;top:9px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.cbadge{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:5px;border:2px solid #fff;box-shadow:3px -3px 0 -1px #0006}
#credits{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}#credits span{font-weight:600}
.setform{display:grid;gap:12px;max-width:640px}.setform label{display:grid;gap:4px;font-weight:600;font-size:14px}.setform small{font-weight:400;color:var(--mut)}
.okline{color:var(--up);font-weight:600}.errline{color:var(--down);font-weight:600}.keybox{font:600 14px ui-monospace,monospace;background:var(--zone);padding:10px 12px;border-radius:9px;word-break:break-all;user-select:all}
.tlist{display:grid;gap:8px}.trow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:center}.trow.head{font-size:12px;color:var(--mut)}@media(max-width:900px){.trow{grid-template-columns:1fr}.trow.head{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
